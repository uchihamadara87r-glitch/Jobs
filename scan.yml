name: Scan jobs
on:
  schedule:
    - cron: "0 22 * * *"   # 06:00 Malaysia time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scan.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: Commit results
        run: |
          git config user.name "jarvis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add jobs.json
          git diff --staged --quiet || (git commit -m "Update jobs" && git push)
