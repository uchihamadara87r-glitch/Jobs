function migrate(o){const have=new Map((o.resumes||[]).map(r=>[r.id,r]));o.resumes=o.resumes||[];SEED.forEach(x=>{const h=have.get(x.id);if(!h)o.resumes.push({...x,active:false});else if(!h.text)Object.assign(h,{name:x.name,target:x.target,text:x.text,pitch:x.pitch,kw:x.kw})});o.resumes=o.resumes.filter(r=>!(r.id==='hr'&&!r.text));if(!o.resumes.some(r=>r.active))o.resumes[0].active=true;if(o.settings.name==='Amir Firdaus')o.settings.name='Muhammad Amir Firdaus';if(!o.settings.summary)o.settings.summary=DEF_SUMMARY;return o}
function bestResume(j){const t=norm([j.title,j.description,(j.tags||[]).join(' ')].join(' '));let best=null,bs=0;state.resumes.forEach(r=>{const n=(r.kw||[]).filter(k=>t.includes(k)).length;if(n>bs){bs=n;best=r}});return best||state.resumes.find(x=>x.active)||state.resumes[0]}
const DEF_SUMMARY='I currently work as Executive Assistant (MySTEP) at Jabatan Insolvensi Malaysia, Bankruptcy Unit, and hold a Bachelor of Social Science (Hons) in International Relations from UNIMAS.';

const defaultState={settings:{minSalary:2000,salaryMode:'min',location:'Kota Bharu, Kelantan',remote:true,roles:['Administration','HR','Compliance','Government Relations','Policy Analysis'],exclude:['sales','promoter','telemarketing','insurance agent','mlm','internship','part time','driver','retail'],sources:['MYFutureJobs','JobStreet','Indeed','LinkedIn','Hiredly','Maukerja','Company Career Pages'],autoFollow:3,includeUnknown:true,name:'Muhammad Amir Firdaus',summary:DEF_SUMMARY},jobs:[],applications:[],resumes:structuredClone(SEED),events:[],lastScan:null};
let state=load(),tab='home',q='',selectedJob=null,toastTimer=null;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');return migrate({...structuredClone(defaultState),...s,settings:{...defaultState.settings,...(s.settings||{})}})}catch{return structuredClone(defaultState)}}
function uid(){return globalThis.crypto?.randomUUID?.()||'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
let memOnly=false;
addEventListener('error',e=>toast('Error: '+e.message));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){memOnly=true}render()}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(s){clearTimeout(toastTimer);document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);toastTimer=setTimeout(()=>d.remove(),1800)}
function salRange(j){const f=v=>(String(v??'').replace(/,/g,'').match(/\d+(?:\.\d+)?\s*[kK]?/g)||[]).map(x=>parseFloat(x)*(/k/i.test(x)?1000:1));const a=f(j.salaryMin),b=f(j.salaryMax),c=f(j.salary);let min=a[0]??c[0]??0,max=b[0]??c[1]??c[0]??min;if(max<min)[min,max]=[max,min];return [min,max]}
function norm(s=''){return s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function salaryOk(j){const [min,max]=salRange(j),T=state.settings.minSalary,m=state.settings.salaryMode;if(!min&&!max)return state.settings.includeUnknown!==false;if(m==='max')return max>=T;if(m==='range')return min<=T&&max>=T;return min>=T||(!min&&max>=T)}
function scoreJob(j){const text=norm([j.title,j.description,j.company,j.location,(j.tags||[]).join(' ')].join(' '));const roles=state.settings.roles.map(norm);let role=roles.some(r=>text.includes(r))?100:Math.max(0,...roles.map(r=>r.split(' ').filter(Boolean).filter(x=>text.includes(x)).length*25));let skill=0;const kws=['administration','compliance','hr','human resources','policy','government','documentation','legal','operations','recruitment','records','research'];skill=Math.min(100,kws.filter(k=>text.includes(k)).length*12);const jl=norm(j.location||'');let loc=state.settings.location.split(',').map(norm).filter(Boolean).some(t=>jl.includes(t))?100:/malaysia/i.test(j.location||'')?65:25;if(j.remote&&state.settings.remote)loc=Math.max(loc,90);const [sa,sb]=salRange(j);let salary=!sa&&!sb?50:salaryOk(j)?100:0;let excluded=state.settings.exclude.some(x=>text.includes(norm(x)));let fresh=j.postedAt?Math.max(0,100-Math.floor((Date.now()-new Date(j.postedAt))/86400000)*7):50;let total=Math.round(role*.27+skill*.23+loc*.15+salary*.2+fresh*.15);if(excluded)total=Math.min(total,20);return {total,role,skill,loc,salary,fresh,excluded}}
function fingerprint(j){return norm(`${j.company}|${j.title}|${j.location||''}`)}
function addJobs(arr){let map=new Map(state.jobs.map(j=>{j.fp=fingerprint(j);return [j.fp,j]}));let added=0;for(const raw of arr){if(!raw||!raw.title)continue;const j={...raw,id:uid(),title:String(raw.title).trim(),company:String(raw.company||'Unknown').trim(),remote:raw.remote===true||/^(true|yes|1)$/i.test(String(raw.remote||'')),tags:Array.isArray(raw.tags)?raw.tags:String(raw.tags||'').split(/[;|]/).map(x=>x.trim()).filter(Boolean),source:raw.source||'Imported',postedAt:raw.postedAt||new Date().toISOString()};j.fp=fingerprint(j);if(!map.has(j.fp)){map.set(j.fp,j);added++}else{const old=map.get(j.fp);old.sources=[...new Set([...(old.sources||[old.source]),j.source])];if(!old.url&&j.url)old.url=j.url}}state.jobs=[...map.values()];state.lastScan=new Date().toISOString();state.events.push({t:Date.now(),type:'scan',n:arr.length});save();toast(`${added} new, ${arr.length-added} duplicate/skipped`)}
function demoJobs(){addJobs([{title:'Compliance Executive',company:'Example Bank',location:'Kota Bharu, Kelantan',salaryMin:2500,salaryMax:3500,url:'https://example.com/apply',source:'Demo',description:'Compliance documentation, regulatory research, administration and reporting.',tags:['Compliance','Documentation'],remote:false},{title:'Administrative Executive',company:'Example Group',location:'Kota Bharu, Kelantan',salaryMin:2300,salaryMax:2800,url:'https://example.com/admin',source:'Demo',description:'Administration, records management, coordination and government liaison.',tags:['Admin','Operations']},{title:'HR Executive',company:'Example People',location:'Kuala Lumpur, Malaysia',salaryMin:2800,salaryMax:3500,url:'https://example.com/hr',source:'Demo',description:'Recruitment, HR administration and employee records.',tags:['HR','Recruitment']}])}
function filteredJobs(){return state.jobs.map(j=>({...j,score:scoreJob(j)})).filter(j=>!j.hidden&&salaryOk(j)&&!j.score.excluded&&(!q||norm([j.title,j.company,j.location,j.source].join(' ')).includes(norm(q)))).sort((a,b)=>b.score.total-a.score.total)}
function metrics(){const a=state.applications;return {apps:a.length,interviews:a.filter(x=>x.status==='interview').length,offers:a.filter(x=>x.status==='offer').length,response:a.length?Math.round(a.filter(x=>['interview','offer'].includes(x.status)).length/a.length*100):0}}
function shell(content){document.querySelector('#root').innerHTML=`<main class="app"><header class="top"><div class="brand"><div class="logo">J</div><div><div class="eyebrow">Job Hunt OS</div><div class="title">Jarvis • Amir Edition</div></div></div><span class="pill">${memOnly?'NOT SAVED':'LOCAL MODE'}</span></header>${content}</main><nav class="nav"><div class="navin">${[['home','⌂','Home'],['jobs','◈','Jobs'],['apply','⚡','Tailor'],['track','✓','Tracker'],['settings','⚙','Settings']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}</div></nav>`}
function home(){const m=metrics(),jobs=filteredJobs().slice(0,5);shell(`<section class="hero"><div class="eyebrow">REALITY CHECK</div><h1 style="margin:5px 0 3px;font-size:22px">Job Hunt Command Center</h1><p class="small muted">Local dashboard. No fake "live" claims. Connect a scanner/backend or import jobs to populate the feed.${state.lastScan?' Last import: '+timeAgo(state.lastScan)+'.':''}</p><div class="grid grid3" style="margin-top:13px"><div class="metric"><b>${m.apps}</b><span>Applied</span></div><div class="metric"><b>${m.interviews}</b><span>Interviews</span></div><div class="metric"><b>${m.response}%</b><span>Response</span></div></div></section><section class="section"><div class="grid grid2"><button class="btn primary" onclick="demoJobs();toast('Demo jobs added')">Load test jobs</button><button class="btn" onclick="openImport()">Import jobs</button><button class="btn" onclick="quickAdd()">＋ Quick add</button><button class="btn good" onclick="openQueue()">▶ Apply queue</button><button class="btn" onclick="syncFeed(true)">↻ Sync feed</button></div></section>${dueHTML()}<section class="section"><div class="sectionhead"><h2>Top matches</h2><button class="pill" onclick="go('jobs')">View all</button></div><div class="list">${jobs.length?jobs.map(jobCard).join(''):`<div class="card empty">No jobs yet.<br>Import a JSON/CSV feed or load test jobs.</div>`}</div></section><section class="section"><div class="card"><div class="sectionhead"><h2>Automation status</h2><span class="status">LOCAL ONLY</span></div><div class="notice">Scheduled scanning, Telegram alerts and browser form submission require an external runner/backend. This HTML now exposes the correct data model and controls instead of pretending those services are running.</div></div></section>`)}
function jobCard(j){return `<article class="card job"><div class="jobtop"><div><div class="jobtitle">${esc(j.title)}</div><div class="small muted">${esc(j.company)} • ${esc(j.location||'Location unknown')}</div></div><div class="score">${j.score.total}%</div></div><div class="row wrap" style="margin-top:8px"><span class="salary">${esc(j.salary||((j.salaryMin||j.salaryMax)?`RM${j.salaryMin||'?'}–RM${j.salaryMax||'?'}`:'Salary unknown'))}</span><span class="status">${esc(j.source)}</span><span class="status">${j.postedAt?timeAgo(j.postedAt):'date unknown'}</span></div><div class="tags">${(j.tags||[]).slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" onclick="viewJob('${j.id}')">Analyse</button><button class="btn" onclick="hideJob('${j.id}')">Hide</button>${j.url?`<button class="btn primary" onclick="openUrl('${j.id}')">Open apply ↗</button>`:'<span class="tiny">NO APPLICATION URL</span>'}</div></article>`}
function timeAgo(d){const h=Math.max(0,Math.floor((Date.now()-new Date(d))/3600000));return h<1?'just now':h<24?`${h}h ago`:`${Math.floor(h/24)}d ago`}
function jobs(){shell(`<section class="section"><div class="sectionhead"><h2>Job feed</h2><div class="row"><button class="btn" onclick="quickAdd()">＋ Add</button><button class="btn" onclick="openImport()">＋ Import</button></div></div>${liveHTML()}<div class="card grid grid2" style="margin-top:10px"><div><label class="label">Minimum salary</label><input class="input" type="number" value="${state.settings.minSalary}" onchange="state.settings.minSalary=+this.value||0;save()"></div><div><label class="label">Salary rule</label><select class="select" onchange="state.settings.salaryMode=this.value;save()"><option value="min" ${state.settings.salaryMode==='min'?'selected':''}>Minimum ≥ target</option><option value="range" ${state.settings.salaryMode==='range'?'selected':''}>Range crosses target</option><option value="max" ${state.settings.salaryMode==='max'?'selected':''}>Maximum ≥ target</option></select></div></div><div class="row" style="margin-top:10px"><label class="small"><input type="checkbox" class="check" ${state.settings.includeUnknown?'checked':''} onchange="state.settings.includeUnknown=this.checked;save()"> Show jobs with unstated salary</label></div><input class="input" style="margin-top:10px" placeholder="Search title, company, location…" value="${esc(q)}" oninput="setQ(this.value)"><div id="jobList" class="list" style="margin-top:10px">${jobListHTML()}</div></section>`)}
function viewJob(id){selectedJob=state.jobs.find(j=>j.id===id);const s=scoreJob(selectedJob);document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="sheet"><div class="sectionhead"><h2>${esc(selectedJob.title)}</h2><button class="btn" onclick="closeModal()">✕</button></div><p class="small muted">${esc(selectedJob.company)} • ${esc(selectedJob.location||'')}</p><div class="grid grid3" style="margin-top:12px">${[['Overall',s.total],['Skills',s.skill],['Location',s.loc],['Salary',s.salary],['Role',s.role],['Freshness',s.fresh]].map(x=>`<div class="card metric"><b>${x[1]}%</b><span>${x[0]}</span></div>`).join('')}</div><div class="divider"></div><div class="notice">${s.excluded?'Excluded by your rules.':'Verdict: '+(s.total>=75?'APPLY':s.total>=55?'REVIEW':'LOW PRIORITY')}. This is a fit heuristic, not a prediction of hiring outcome.</div><div class="divider"></div><h3>Why / gaps</h3><p class="small">${s.role>=75?'✓ Role family matches your preferences.':'△ Role match is weak.'}<br>${s.skill>=60?'✓ Relevant skill signals found.':'△ Limited relevant keyword evidence.'}<br>${s.loc>=90?'✓ Location/remote preference fits.':'△ Location is less aligned.'}<br>${s.salary===50?'△ Salary not stated.':s.salary?'✓ Salary clears your configured rule.':'✕ Salary does not clearly clear the rule.'}</p><div class="row wrap"><button class="btn primary" onclick="tailor('${selectedJob.id}')">⚡ Tailor package</button>${selectedJob.url?`<button class="btn" onclick="openUrl('${selectedJob.id}')">Open application</button>`:''}</div></div></div>`)}
function closeModal(){document.querySelector('.modal')?.remove()}
function tailor(id){closeModal();tab='apply';render();document.querySelector('#jobSelect').value=id;loadSelectedJob()}
function apply(){shell(`<section class="section"><div class="sectionhead"><h2>Tailor & apply package</h2><span class="status">STRICT FACT MODE</span></div><div class="card"><label class="label">Select job</label><select id="jobSelect" class="select" onchange="loadSelectedJob()"><option value="">Choose…</option>${filteredJobs().map(j=>`<option value="${j.id}">${esc(j.title)} — ${esc(j.company)}</option>`).join('')}</select><div id="tailorOut" style="margin-top:12px"></div></div></section>`)}
function loadSelectedJob(){const id=document.querySelector('#jobSelect')?.value;if(!id)return;const j=state.jobs.find(x=>x.id===id),s=scoreJob(j),r=bestResume(j);document.querySelector('#tailorOut').innerHTML=`<div class="notice"><b>${esc(r.name)}</b> selected automatically. The generator may tailor wording only from supplied facts; it must not invent experience.</div>${gapHTML(j,r)}<div class="divider"></div><label class="label">Generated application note</label><textarea class="textarea" id="cover">Dear Hiring Manager,\n\nI am applying for the ${esc(j.title)} position at ${esc(j.company)}. ${esc(r.pitch||state.settings.summary||'')}\n\nI would welcome the opportunity to discuss how my documented experience can contribute to the role.\n\nRegards,\n${esc(state.settings.name)}</textarea><div class="row wrap" style="margin-top:10px"><button class="btn primary" onclick="copyText('cover')">Copy cover letter</button>${j.url?`<button class="btn" onclick="openUrl('${j.id}');markApplied('${j.id}')">Open application + mark</button>`:''}<button class="btn good" onclick="markApplied('${j.id}')">Mark applied</button></div><p class="tiny" style="margin-top:9px">Application submission itself is not performed by this standalone file. It opens the real application URL so browser/portal authentication remains under your control.</p>`}
function copyText(id){navigator.clipboard?.writeText(document.getElementById(id).value);toast('Copied')}
function markApplied(id){const j=state.jobs.find(x=>x.id===id);if(!j)return;const old=state.applications.find(x=>x.jobId===id);if(old)old.status='applied';else state.applications.unshift({id:uid(),jobId:id,company:j.company,role:j.title,date:new Date().toISOString(),score:scoreJob(j).total,status:'applied',followUp:new Date(Date.now()+state.settings.autoFollow*86400000).toISOString()});state.events.push({t:Date.now(),type:'applied',jobId:id});save();toast('Application tracked')}
function track(){const m=metrics();shell(`<section class="section"><div class="grid grid3"><div class="card metric"><b>${m.apps}</b><span>Applications</span></div><div class="card metric"><b>${m.interviews}</b><span>Interviews</span></div><div class="card metric"><b>${m.offers}</b><span>Offers</span></div></div><div class="card section"><div class="sectionhead"><h2>Pipeline</h2><span class="tiny">response ${m.response}%</span></div><div class="list">${state.applications.map(a=>`<div class="source"><div><b>${esc(a.role)}</b><div class="small muted">${esc(a.company)} • ${Math.round(a.score)}% • ${new Date(a.date).toLocaleDateString()}</div>${a.note?`<div class="small">${esc(a.note)}</div>`:''}${fuLabel(a)}<div class="row" style="margin-top:6px"><button class="btn" onclick="editNote('${a.id}')">Note</button><button class="btn danger" onclick="delApp('${a.id}')">Delete</button></div></div><select class="select" style="width:auto" onchange="setStatus('${a.id}',this.value)"><option ${a.status==='applied'?'selected':''}>applied</option><option ${a.status==='interview'?'selected':''}>interview</option><option ${a.status==='offer'?'selected':''}>offer</option><option ${a.status==='rejected'?'selected':''}>rejected</option><option ${a.status==='withdrawn'?'selected':''}>withdrawn</option></select></div>`).join('')||'<div class="empty">No applications tracked.</div>'}</div></div></section>`)}
function setStatus(id,v){const a=state.applications.find(x=>x.id===id);if(a){a.status=v;save()}}
function settings(){shell(`<section class="section"><div class="card"><div class="sectionhead"><h2>Preferences</h2><button class="btn primary" onclick="saveSettings()">Save</button></div><label class="label">Preferred location</label><input id="loc" class="input" value="${esc(state.settings.location)}"><div class="row" style="margin-top:10px"><label class="small"><input type="checkbox" id="remote" class="check" ${state.settings.remote?'checked':''}> Include remote jobs</label></div><div style="margin-top:10px"><label class="label">Your name (cover letter)</label><input id="pname" class="input" value="${esc(state.settings.name)}"></div><div style="margin-top:10px"><label class="label">Profile summary (true facts only)</label><textarea id="psum" class="textarea" style="min-height:70px">${esc(state.settings.summary)}</textarea></div><div style="margin-top:10px"><label class="label">Follow up after (days)</label><input id="fu" type="number" class="input" value="${state.settings.autoFollow}"></div><div style="margin-top:10px"><label class="label">Roles</label><input id="roles" class="input" value="${esc(state.settings.roles.join(', '))}"></div><div style="margin-top:10px"><label class="label">Excluded keywords</label><textarea id="exclude" class="textarea">${esc(state.settings.exclude.join(', '))}</textarea></div></div><div class="card section"><div class="sectionhead"><h2>Resume routing</h2><button class="btn" onclick="addResume()">＋ Add</button></div>${state.resumes.map(r=>`<div class="source"><div><b>${esc(r.name)}</b><div class="tiny">${esc(r.target)}</div></div><div class="row"><button class="btn" onclick="editResume('${r.id}')">Edit</button><button class="btn ${r.active?'primary':''}" onclick="setResume('${r.id}')">${r.active?'ACTIVE':'USE'}</button></div></div>`).join('')}</div><div class="card section"><h2 style="margin-top:0">Sources</h2>${state.settings.sources.map(s=>`<div class="source"><span>${esc(s)}</span><span class="status">IMPORT/API READY</span></div>`).join('')}<p class="tiny">A standalone HTML page cannot bypass CORS, login walls or anti-bot controls. Use an external runner for scheduled fetching.</p></div><div class="card section"><h2 style="margin-top:0">Data</h2><div class="row wrap"><button class="btn" onclick="exportData()">Export JSON</button><label class="btn" style="display:inline-block">Restore backup<input type="file" accept="application/json" class="hidden" onchange="restoreData(this)"></label><button class="btn danger" onclick="resetAll()">Reset local data</button></div></div></section>`)}
function saveSettings(){state.settings.location=document.querySelector('#loc').value;state.settings.remote=document.querySelector('#remote').checked;state.settings.name=document.querySelector('#pname').value.trim()||defaultState.settings.name;state.settings.summary=document.querySelector('#psum').value.trim();state.settings.autoFollow=Math.max(1,+document.querySelector('#fu').value||3);state.settings.roles=document.querySelector('#roles').value.split(',').map(x=>x.trim()).filter(Boolean);state.settings.exclude=document.querySelector('#exclude').value.split(',').map(x=>norm(x)).filter(Boolean);save();toast('Preferences saved')}
function setResume(id){state.resumes.forEach(r=>r.active=r.id===id);save();toast('Resume routing updated')}
function addResume(){const name=prompt('Resume name?');if(name){state.resumes.push({id:uid(),name,target:'Custom',active:false});save()}}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jarvis-job-hunt-backup.json';a.click();URL.revokeObjectURL(a.href)}
function resetAll(){if(confirm('Delete all local jobs, applications and settings?')){try{localStorage.removeItem(KEY)}catch(e){}state=load();render()}}
function openImport(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="sheet"><div class="sectionhead"><h2>Import job feed</h2><button class="btn" onclick="closeModal()">✕</button></div><p class="small muted">Paste JSON array. CSV is also accepted with columns: title,company,location,salaryMin,salaryMax,url,source,description,postedAt.</p><textarea id="importText" class="textarea" placeholder='[{"title":"Compliance Executive","company":"ABC","location":"Kota Bharu, Kelantan","salaryMin":2500,"salaryMax":3500,"url":"https://..."}]'></textarea><button class="btn primary" style="margin-top:10px;width:100%" onclick="doImport()">Import & deduplicate</button></div></div>`)}
function doImport(){const raw=document.querySelector('#importText').value.trim();try{let arr;if(raw.startsWith('[')){arr=JSON.parse(raw)}else{arr=parseCSV(raw)}if(!Array.isArray(arr))throw 0;closeModal();addJobs(arr)}catch{toast('Invalid JSON/CSV')}}
const KW=['administration','compliance','hr','human resources','policy','government','documentation','legal','operations','recruitment','records','research'];
function openUrl(id){const j=state.jobs.find(x=>x.id===id);try{const u=new URL(j.url);if(!/^https?:$/.test(u.protocol))throw 0;window.open(u.href,'_blank','noopener')}catch{toast('Invalid or unsafe URL')}}
function hideJob(id){const j=state.jobs.find(x=>x.id===id);if(j){j.hidden=true;save();toast('Job hidden')}}
function jobListHTML(){return filteredJobs().map(jobCard).join('')||'<div class="card empty">No matching jobs.</div>'}
function setQ(v){q=v;document.querySelector('#jobList').innerHTML=jobListHTML()}
function parseCSV(t){const rows=[];let r=[],c='',inq=false;for(let i=0;i<t.length;i++){const ch=t[i];if(inq){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else inq=false}else c+=ch}else if(ch=='"')inq=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}const h=rows.shift().map(x=>x.trim());return rows.filter(x=>x.some(Boolean)).map(v=>Object.fromEntries(h.map((k,i)=>[k,(v[i]||'').trim()])))}
function fuLabel(a){if(a.status!=='applied'||!a.followUp)return '';const d=Math.ceil((new Date(a.followUp)-Date.now())/864e5);return `<div class="tiny ${d<=0?'warntxt':''}">Follow up ${d<=0?'DUE':'in '+d+'d'} (${new Date(a.followUp).toLocaleDateString()})</div>`}
function dueHTML(){const due=state.applications.filter(a=>a.status==='applied'&&a.followUp&&new Date(a.followUp)<=Date.now());return due.length?`<section class="section"><div class="card"><div class="sectionhead"><h2>Follow-ups due</h2><button class="pill" onclick="go('track')">Open</button></div>${due.map(a=>`<div class="small">${esc(a.role)} — ${esc(a.company)}</div>`).join('')}</div></section>`:''}
function editNote(id){const a=state.applications.find(x=>x.id===id);if(!a)return;const n=prompt('Note (interview date, contact, etc.)',a.note||'');if(n!==null){a.note=n;save()}}
function delApp(id){if(confirm('Delete this application?')){state.applications=state.applications.filter(x=>x.id!==id);save()}}
function gapHTML(j,r){const rt=norm(r.text||'');if(!rt)return '<p class="tiny">Resume text is empty. Add it in Settings → Edit to see keyword gaps.</p>';const t=norm([j.title,j.description,(j.tags||[]).join(' ')].join(' ')),k=KW.filter(x=>t.includes(x)),miss=k.filter(x=>!rt.includes(x));return `<p class="small">Keyword match: ${k.length-miss.length}/${k.length}${miss.length?'<br>Not in your resume text: '+miss.map(esc).join(', ')+' (add only if true)':''}</p>`}
function editResume(id){const r=state.resumes.find(x=>x.id===id);if(!r)return;document.body.insertAdjacentHTML('beforeend',`<div class="modal"><div class="sheet"><div class="sectionhead"><h2>${esc(r.name)}</h2><button class="btn" onclick="closeModal()">✕</button></div><p class="small muted">Paste your real resume text. Used only for keyword-gap checks; stored on this device.</p><textarea id="rtext" class="textarea" style="min-height:220px">${esc(r.text||'')}</textarea><button class="btn primary" style="margin-top:10px;width:100%" onclick="saveResume('${r.id}')">Save</button></div></div>`)}
function saveResume(id){const r=state.resumes.find(x=>x.id===id);if(r){r.text=document.querySelector('#rtext').value;closeModal();save();toast('Resume saved')}}
function restoreData(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||typeof d!=='object')throw 0;const cid=x=>String(x||uid()).replace(/[^\w-]/g,''),fix=a=>(Array.isArray(a)?a:[]).map(x=>({...x,id:cid(x.id)})),rs=fix(d.resumes);state={...structuredClone(defaultState),...d,settings:{...defaultState.settings,...(d.settings||{})},jobs:fix(d.jobs),applications:fix(d.applications).map(a=>({...a,jobId:String(a.jobId||'').replace(/[^\w-]/g,'')})),resumes:rs.length?rs:structuredClone(defaultState.resumes)};migrate(state);save();toast('Backup restored')}catch{toast('Invalid backup file')}};rd.readAsText(f)}
let qList=[],qi=0;
function letter(j,r){return `Dear Hiring Manager,\n\nI am applying for the ${j.title} position at ${j.company}. ${r.pitch||state.settings.summary||''}\n\nI would welcome the opportunity to discuss how my documented experience can contribute to the role.\n\nRegards,\n${state.settings.name}`}
function liveHTML(){return `<div class="card"><div class="sectionhead"><h2>Live search</h2><span class="tiny">opens the real portals</span></div><select id="lrole" class="select">${state.settings.roles.map(r=>`<option>${esc(r)}</option>`).join('')}</select><div class="row wrap" style="margin-top:8px">${['JobStreet','Indeed','LinkedIn','Jora','Google'].map(p=>`<button class="btn" onclick="liveOpen('${p}')">${p}</button>`).join('')}</div><p class="tiny" style="margin-top:8px">Found a good one? Tap ＋ Add, paste it, and it gets scored and tracked.</p></div>`}
function liveOpen(p){const role=document.querySelector('#lrole').value,e=encodeURIComponent,loc=state.settings.location,slug=norm(role).replace(/ /g,'-');const u={JobStreet:`https://my.jobstreet.com/${slug}-jobs/in-Kelantan`,Indeed:`https://malaysia.indeed.com/jobs?q=${e(role)}&l=${e(loc)}&sort=date`,LinkedIn:`https://www.linkedin.com/jobs/search/?keywords=${e(role)}&location=${e(loc+', Malaysia')}&f_TPR=r604800`,Jora:`https://my.jora.com/j?q=${e(role)}&l=${e(loc)}`,Google:`https://www.google.com/search?q=${e(role+' jobs '+loc)}&ibp=htl;jobs`}[p];window.open(u,'_blank','noopener')}
function quickAdd(){closeModal();document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="sheet"><div class="sectionhead"><h2>Add a job</h2><button class="btn" onclick="closeModal()">✕</button></div><div class="grid"><input id="qt" class="input" placeholder="Job title *"><input id="qc" class="input" placeholder="Company"><input id="ql" class="input" placeholder="Location (default: ${esc(state.settings.location)})"><input id="qs" class="input" placeholder="Salary (optional, e.g. RM2,500 - RM3,500)"><input id="qu" class="input" placeholder="Application URL (https://…)"><textarea id="qd" class="textarea" placeholder="Paste the job description here. Salary is detected automatically if it contains RM…"></textarea><button class="btn primary" onclick="doQuick()">Add & score</button></div></div></div>`)}
function doQuick(){const g=id=>document.querySelector('#'+id).value.trim(),d=g('qd');let sal=g('qs');if(!g('qt')){toast('Title required');return}if(!sal){const m=d.match(/RM\s?[\d,]+(?:\s*(?:-|–|to)\s*(?:RM\s?)?[\d,]+)?/i);if(m)sal=m[0]}const job={title:g('qt'),company:g('qc'),location:g('ql')||state.settings.location,salary:sal,url:g('qu'),description:d,source:'Manual'};closeModal();addJobs([job])}
function openQueue(){qList=filteredJobs().filter(j=>j.score.total>=55&&!state.applications.some(a=>a.jobId===j.id));qi=0;showQ()}
function showQ(){closeModal();const j=qList[qi];if(!j){toast('Apply queue finished');return}const r=bestResume(j);document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="sheet"><div class="sectionhead"><h2>Apply queue ${qi+1}/${qList.length}</h2><button class="btn" onclick="closeModal()">✕</button></div><div class="card"><div class="jobtitle">${esc(j.title)}</div><div class="small muted">${esc(j.company)} • ${esc(j.location||'')} • ${j.score.total}%</div><div class="tiny" style="margin-top:6px">Attach this resume: <b>${esc(r.name)}</b></div></div><label class="label" style="margin-top:10px">Cover letter (edit if needed)</label><textarea class="textarea" id="qcover">${esc(letter(j,r))}</textarea><div class="grid grid2" style="margin-top:10px"><button class="btn primary" onclick="qOpen('${j.id}')">Copy letter &amp; open</button><button class="btn good" onclick="qDone('${j.id}')">I applied ✓</button><button class="btn" onclick="qNext()">Skip</button><button class="btn danger" onclick="hideJob('${j.id}');qNext()">Hide</button></div><p class="tiny" style="margin-top:8px">You submit on the real portal. This only prepares the letter and tracks the result.</p></div></div>`)}
function qOpen(id){navigator.clipboard?.writeText(document.querySelector('#qcover').value);openUrl(id);toast('Letter copied')}
function qDone(id){markApplied(id);qNext()}
function qNext(){qi++;showQ()}
async function syncFeed(manual){if(!/^https?:/.test(location.protocol)){if(manual)toast('Sync works on the hosted (GitHub Pages) page only');return}try{const r=await fetch('jobs.json?t='+Date.now());if(!r.ok)throw 0;const d=await r.json(),arr=Array.isArray(d)?d:(d.jobs||[]),have=new Set(state.jobs.map(fingerprint)),fresh=arr.filter(j=>j&&j.title&&!have.has(fingerprint({...j,company:j.company||'Unknown'})));if(fresh.length)addJobs(fresh);else if(manual)toast('Feed is up to date')}catch(e){if(manual)toast('Feed not available yet')}}
setTimeout(()=>syncFeed(false),400);
function go(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){({home,jobs,apply,track,settings}[tab]||home)()}
render();
</script></body></html>
